# Builds the three installers: utter_<v>_amd64.deb (Ubuntu), Utter-<v>-mac.dmg (Apple silicon), Utter-Setup-<v>.exe.
# Each is built on its own OS (none can be cross-built). Run it from the Actions tab, or push a tag v<version> to also
# publish them as a GitHub release.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]  # 22.04: built on the oldest Ubuntu it should run on
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r packaging/requirements.txt
          echo "VERSION=$(sed -n 's/^VERSION = "\(.*\)".*/\1/p' src/utter/__init__.py)" >> "$GITHUB_ENV"

      - name: Check the bundled ffmpeg has the encoders Utter uses
        if: runner.os != 'Linux'
        run: |
          ff=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          "$ff" -hide_banner -encoders > encoders.txt
          grep -q libopus encoders.txt && grep -q libmp3lame encoders.txt

      - name: Build the app
        run: pyinstaller --noconfirm --distpath dist --workpath build/pyinstaller packaging/utter.spec

      - name: Package (.deb)
        if: runner.os == 'Linux'
        env:
          DEB_MAINTAINER: "Utter <${{ github.repository_owner }}@users.noreply.github.com>"
        run: packaging/build-deb.sh "$VERSION"

      - name: Package (.dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg
          cp -R dist/Utter.app build/dmg/
          ln -s /Applications build/dmg/Applications   # drag Utter onto Applications to install
          hdiutil create -volname Utter -srcfolder build/dmg -ov -format UDZO "dist/Utter-$VERSION-mac.dmg"

      - name: Package (.exe)
        if: runner.os == 'Windows'
        run: |
          python -c "from PIL import Image; Image.open('data/utter.png').save('build/utter.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$iscc" ] || { choco install innosetup -y --no-progress; }
          "$iscc" "//DVERSION=$VERSION" packaging/utter.iss

      - uses: actions/upload-artifact@v4
        with:
          name: utter-${{ runner.os }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*

  # The apt repository behind `sudo apt install utter`, served by GitHub Pages at https://arunkukrety.github.io/utter/
  # (users add it once with packaging/apt/setup.sh). Signed with the APT_SIGNING_KEY secret.
  apt:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: utter-Linux
          path: out
      - name: Build the signed repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get install -y -qq apt-utils  # apt-ftparchive
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          packaging/apt/build-repo.sh out/*.deb site "$key"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
